name: Unit Test Docker Image Build and Run

on:
  pull_request:
    branches: [ main, master ]


jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3


    
    - name: Build Toto Test Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Tests/toto.dockerfile
        push: false
        load: true  
        tags: imagebin-api:toto

    - name: Run Unit Tests
      run: |
        docker run --rm imagebin-api:toto
  test-build-prod-image:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Production Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        load: true  
        tags: imagebin-api:prod

  ruff_check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: ruff-action
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check
          version: 0.16.0
